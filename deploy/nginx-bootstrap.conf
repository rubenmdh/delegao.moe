# HTTP-only ACME bootstrap. No certificate files are referenced before issuance.
# Install temporarily as /etc/nginx/sites-available/delegao.moe.
server {
    listen 80;
    listen [::]:80;
    server_name delegao.moe;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
