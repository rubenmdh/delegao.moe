# Install only AFTER issuing the delegao.moe certificate; see orange-pi.md.
# Proxy generated pages through Go too: its manifest switches generations
# atomically and blocks stale pages after a failed unpublish/delete rebuild.
upstream delegao_backend {
    server 127.0.0.1:8080;
    keepalive 4;
}

server {
    listen 80;
    listen [::]:80;
    server_name delegao.moe;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://delegao.moe$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name delegao.moe;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/delegao.moe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/delegao.moe/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DelegaoTLS:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;
    client_body_timeout 15s;
    keepalive_timeout 30s;

    gzip on;
    gzip_comp_level 2;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://delegao_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite untrusted client-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        # Do not add proxy_cache here: authenticated pages and CSRF forms
        # must retain the backend's Cache-Control: no-store.
    }
}
