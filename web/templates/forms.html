{{define "login"}}<div class="login-form mx-auto"><h1 class="h4 mb-4">delegao.moe area 51</h1>
<form method="post" action="{{route "login"}}"><input type="hidden" name="csrf" value="{{.CSRF}}">
<div class="form-group"><label for="username">Username</label><input class="form-control" id="username" name="username" maxlength="50" autocomplete="username" required></div>
<div class="form-group"><label for="password">Password</label><input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required></div><button class="btn btn-primary">Log in</button></form></div>{{end}}

{{define "editor"}}<h1 class="h3">{{if .Post.ID}}Modify an existing post{{else}}Create a new post{{end}}</h1>
<form method="post" action="{{.Action}}"><input type="hidden" name="csrf" value="{{.CSRF}}">
<div class="form-group"><label for="title">Title</label><input class="form-control" id="title" name="title" maxlength="255" value="{{.Post.Title}}" required></div>
<div class="form-group"><label for="body">Body</label><textarea class="form-control" id="body" name="body" rows="15" maxlength="500000" required>{{.Post.Body}}</textarea><small>Markdown is supported. Embedded HTML is disabled.</small></div>
<div class="form-group"><label for="tags">Tags</label><input class="form-control" id="tags" name="tags" maxlength="1000" value="{{.Post.Tags}}"></div>
<fieldset class="form-group"><legend class="h6">Status</legend><label><input type="radio" name="status" value="1" {{if .Post.Published}}checked{{end}} required> Published</label> <label><input type="radio" name="status" value="0" {{if not .Post.Published}}checked{{end}}> Draft</label></fieldset>
<a class="btn btn-secondary" href="{{route "admin.posts"}}">Cancel</a> <button class="btn btn-primary">Save</button></form>{{end}}
