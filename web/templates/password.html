{{define "password"}}
<h1 class="h3 mb-3">Change password</h1>
<p>Confirm your current password to update this account. All its sessions will be signed out after saving.</p>
<form method="post" action="{{route "admin.password"}}" class="admin-password">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<div class="form-group"><label for="current-password">Current password</label><input class="form-control" type="password" id="current-password" name="current_password" autocomplete="current-password" required></div>
<div class="form-group"><label for="new-password">New password</label><input class="form-control" type="password" id="new-password" name="new_password" autocomplete="new-password" minlength="15" aria-describedby="password-help" required><small id="password-help" class="form-text">At least 15 characters, up to 72 UTF-8 bytes. Passphrases and spaces are welcome.</small></div>
<div class="form-group"><label for="confirm-password">Repeat new password</label><input class="form-control" type="password" id="confirm-password" name="confirm_password" autocomplete="new-password" minlength="15" required></div>
<button class="btn btn-primary" type="submit">Change password</button> <a class="btn btn-secondary" href="{{route "admin"}}">Cancel</a>
</form>
{{end}}
